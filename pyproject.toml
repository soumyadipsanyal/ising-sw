[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ising"
version = "0.1.0"
description = "Monte Carlo algorithms for the 2D Ising model (Krauth, Statistical Mechanics: Algorithms and Computations, chapter 5)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "numba", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]